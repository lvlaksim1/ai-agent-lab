name: SRRM Reaction Sender Rearm Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/srrm-reaction-sender-rearm-probe.yml'

permissions:
  issues: read
  pull-requests: read
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Detect sender-side remove and re-add of same opcode
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: "1"
          OWNER_LOGIN: "lvlaksim1"
          TARGET: "eyes"
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error
          repo=os.environ["REPO"]; pr=os.environ["PR_NUMBER"]; owner=os.environ["OWNER_LOGIN"]; target=os.environ["TARGET"]; token=os.environ["GH_TOKEN"]
          url=f"https://api.github.com/repos/{repo}/issues/{pr}/reactions?per_page=100"

          def get(etag=None):
              headers={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
              if etag: headers["If-None-Match"]=etag
              req=urllib.request.Request(url,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      return r.status, r.headers.get("ETag"), json.loads(r.read() or b"[]")
              except urllib.error.HTTPError as e:
                  if e.code==304:
                      return 304, e.headers.get("ETag") or etag, None
                  raise

          def match(items):
              if not items: return None
              rows=[x for x in items if x.get("user",{}).get("login")==owner and x.get("content")==target]
              if not rows: return None
              x=rows[-1]
              return (str(x.get("id")), str(x.get("created_at")))

          code,etag,items=get()
          base=match(items)
          print(f"BASE code={code} key={base} etag_present={bool(etag)}",flush=True)
          if base is None:
              print("RESULT=FAIL_NO_BASELINE",flush=True); raise SystemExit(2)

          clear_seen=False
          for poll in range(1,19):
              time.sleep(5)
              code,new_etag,items=get(etag)
              etag=new_etag or etag
              if code==304:
                  print(f"POLL poll={poll} code=304 clear_seen={clear_seen}",flush=True)
                  continue
              cur=match(items)
              print(f"POLL poll={poll} code=200 key={cur} clear_seen={clear_seen}",flush=True)
              if cur is None:
                  clear_seen=True
                  print(f"CLEAR_SEEN poll={poll}",flush=True)
                  continue
              if cur != base:
                  print(f"REARM_DETECTED poll={poll} old={base} new={cur} clear_seen={clear_seen}",flush=True)
                  print("RESULT=PASS_SAME_OPCODE_NEW_GENERATION",flush=True)
                  raise SystemExit(0)

          print("RESULT=TIMEOUT",flush=True)
          raise SystemExit(3)
          PY
