name: SRRM Check Suite Rerequest Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/srrm-check-suite-rerequest-probe.yml'

permissions:
  checks: write
  actions: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Rerequest fixed check suite with raw reaction payload
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SUITE_ID: "99647359827"
        shell: bash
        run: |
          set -euo pipefail
          url="https://api.github.com/repos/$REPO/check-suites/$SUITE_ID/rerequest"
          body='{"action":"created","reaction":{"content":"eyes"},"repository":{"full_name":"lvlaksim1/ai-agent-lab"}}'
          code="$(curl -sS -o /tmp/body -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -X POST -d "$body" "$url")"
          echo "REREQUEST_HTTP=$code"
          cat /tmp/body || true
          echo
