name: SRRM PR Signal Probe

on:
  pull_request:
    types: [converted_to_draft]

permissions:
  pull-requests: write
  contents: read

jobs:
  reset-signal:
    if: github.event.pull_request.number == 1
    runs-on: ubuntu-latest
    steps:
      - name: Reset signal PR to ready
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr ready "$PR_URL"
