name: SRRM Reaction 30s Cadence Listener

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/srrm-dual-loop-probe.yml'

permissions:
  issues: read
  pull-requests: read
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Simulate Telegram long poll plus conservative reaction listener
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: "1"
          OWNER_LOGIN: "lvlaksim1"
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/dual_probe.py <<'PY'
          import json, os, threading, time, urllib.error, urllib.request
          from datetime import datetime, timezone

          token=os.environ["GH_TOKEN"]
          repo=os.environ["REPO"]
          pr=os.environ["PR_NUMBER"]
          owner=os.environ["OWNER_LOGIN"]
          url=f"https://api.github.com/repos/{repo}/issues/{pr}/reactions?per_page=100"
          expected=["heart","rocket","hooray"]

          def req(etag=None):
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "srrm-reaction-30s-listener",
              }
              if etag:
                  headers["If-None-Match"]=etag
              request=urllib.request.Request(url,headers=headers)
              try:
                  with urllib.request.urlopen(request,timeout=20) as resp:
                      raw=resp.read()
                      return resp.status, resp.headers, json.loads(raw or b"[]")
              except urllib.error.HTTPError as exc:
                  if exc.code == 304:
                      return 304, exc.headers, None
                  raise

          stop=threading.Event()
          def telegram_loop():
              seq=0
              while not stop.is_set():
                  seq += 1
                  print(f"TELEGRAM_LONG_POLL_SIM start seq={seq}",flush=True)
                  stop.wait(50)
                  print(f"TELEGRAM_LONG_POLL_SIM end seq={seq}",flush=True)

          status,h,body=req()
          etag=h.get("ETag","")
          seen={str(x["id"]) for x in body if x.get("user",{}).get("login")==owner}
          used0=h.get("X-RateLimit-Used","")
          print(f"BASELINE owner_reactions={len(seen)} used={used0}",flush=True)

          t=threading.Thread(target=telegram_loop,daemon=True)
          t.start()

          found=[]
          deadline=time.monotonic()+600
          polls=0
          try:
              while time.monotonic() < deadline:
                  time.sleep(10)
                  polls += 1
                  status,h,body=req(etag)
                  used=h.get("X-RateLimit-Used","")
                  if h.get("ETag"):
                      etag=h["ETag"]
                  if status == 304:
                      print(f"POLL poll={polls} code=304 used={used} telegram_alive={t.is_alive()} found={len(found)}",flush=True)
                      continue
                  for x in body or []:
                      rid=str(x.get("id"))
                      content=x.get("content")
                      if x.get("user",{}).get("login")!=owner or rid in seen:
                          continue
                      seen.add(rid)
                      if content not in expected:
                          print(f"IGNORED id={rid} content={content}",flush=True)
                          continue
                      now=datetime.now(timezone.utc).isoformat().replace("+00:00","Z")
                      print(
                          f"SIGNAL seq={len(found)+1} id={rid} content={content} "
                          f"created_at={x.get('created_at')} detected_at={now} "
                          f"poll={polls} telegram_alive={t.is_alive()} used={used}",
                          flush=True,
                      )
                      found.append(content)
                  if all(x in found for x in expected):
                      print(f"RESULT=PASS_ALL_THREE order={','.join(found)} polls={polls}",flush=True)
                      raise SystemExit(0)
              print(f"RESULT=TIMEOUT found={','.join(found) if found else 'NONE'} polls={polls}",flush=True)
              raise SystemExit(3)
          finally:
              stop.set()
          PY

          python3 /tmp/dual_probe.py
