name: SRRM Dual Loop Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/srrm-dual-loop-probe.yml'

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Simulate Telegram long poll plus 5s reaction listener
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: "1"
          OWNER_LOGIN: "lvlaksim1"
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/dual_probe.py <<'PY'
          import json, os, threading, time, urllib.request
          from datetime import datetime, timezone

          token=os.environ["GH_TOKEN"]
          repo=os.environ["REPO"]
          pr=os.environ["PR_NUMBER"]
          owner=os.environ["OWNER_LOGIN"]
          url=f"https://api.github.com/repos/{repo}/issues/{pr}/reactions?per_page=100"

          def req(etag=None):
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "srrm-dual-loop-probe",
              }
              if etag:
                  headers["If-None-Match"]=etag
              r=urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(r, timeout=20) as resp:
                      body=resp.read()
                      return resp.status, resp.headers, json.loads(body or b"[]")
              except urllib.error.HTTPError as e:
                  if e.code == 304:
                      return 304, e.headers, None
                  raise

          def telegram_block():
              print("TELEGRAM_LONG_POLL_SIM start", flush=True)
              time.sleep(50)
              print("TELEGRAM_LONG_POLL_SIM end", flush=True)

          status,h,body=req()
          etag=h.get("ETag","")
          seen={str(x["id"]) for x in body if x.get("user",{}).get("login")==owner}
          used0=h.get("X-RateLimit-Used","")
          print(f"BASELINE seen={len(seen)} used={used0}", flush=True)

          t=threading.Thread(target=telegram_block, daemon=True)
          t.start()

          deadline=time.monotonic()+70
          polls=0
          while time.monotonic() < deadline:
              time.sleep(5)
              polls += 1
              status,h,body=req(etag)
              used=h.get("X-RateLimit-Used","")
              if h.get("ETag"):
                  etag=h["ETag"]
              if status == 304:
                  print(f"POLL poll={polls} code=304 used={used} telegram_alive={t.is_alive()}", flush=True)
                  continue
              for x in body or []:
                  rid=str(x.get("id"))
                  if x.get("user",{}).get("login")!=owner or rid in seen:
                      continue
                  seen.add(rid)
                  now=datetime.now(timezone.utc).isoformat().replace("+00:00","Z")
                  print(
                      f"SIGNAL id={rid} content={x.get('content')} created_at={x.get('created_at')} "
                      f"detected_at={now} poll={polls} telegram_alive={t.is_alive()} used={used}",
                      flush=True,
                  )
                  if not t.is_alive():
                      print("RESULT=FAIL_BLOCKING_LOOP_ALREADY_ENDED", flush=True)
                      raise SystemExit(2)

                  print("DETECTED_DURING_BLOCKING_LONG_POLL=1", flush=True)
                  time.sleep(5)

                  delete_url=f"https://api.github.com/repos/{repo}/issues/{pr}/reactions/{rid}"
                  dr=urllib.request.Request(
                      delete_url,
                      headers={
                          "Authorization": f"Bearer {token}",
                          "Accept": "application/vnd.github+json",
                          "X-GitHub-Api-Version": "2022-11-28",
                          "User-Agent": "srrm-dual-loop-probe",
                      },
                      method="DELETE",
                  )
                  with urllib.request.urlopen(dr, timeout=20) as resp:
                      print(f"DELETE status={resp.status} telegram_alive={t.is_alive()}", flush=True)

                  time.sleep(5)
                  status2,h2,body2=req()
                  present=any(str(y.get("id"))==rid for y in (body2 or []))
                  print(f"VERIFY present={present} telegram_alive={t.is_alive()}", flush=True)
                  if not present and t.is_alive():
                      print("RESULT=PASS_DETECT_AND_RESET_DURING_BLOCKING_LONG_POLL", flush=True)
                      raise SystemExit(0)
                  print("RESULT=FAIL_RESET_OR_CONCURRENCY", flush=True)
                  raise SystemExit(4)
          print("RESULT=TIMEOUT", flush=True)
          raise SystemExit(3)
          PY

          python3 /tmp/dual_probe.py
