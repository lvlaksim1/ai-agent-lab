name: SRRM URL Userinfo Auth Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/srrm-url-userinfo-auth-probe.yml'

permissions:
  actions: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Test GitHub API auth through URL userinfo
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_RUN: "36790770227"
        shell: bash
        run: |
          set -euo pipefail
          body='{"action":"created","reaction":{"content":"eyes"}}'
          url="https://x-access-token:$GH_TOKEN@api.github.com/repos/$REPO/actions/runs/$TARGET_RUN/rerun-failed-jobs"
          code="$(curl -sS -o /tmp/body -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -X POST -d "$body" "$url")"
          echo "HTTP=$code"
          cat /tmp/body || true
          echo
