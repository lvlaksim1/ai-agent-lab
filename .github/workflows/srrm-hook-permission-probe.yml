name: SRRM Hook Permission Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/srrm-hook-permission-probe.yml'

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe whether GITHUB_TOKEN can create/delete repository webhook
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set +e
          api="https://api.github.com/repos/$REPO/hooks"
          body='{"name":"web","active":false,"events":["reaction"],"config":{"url":"https://example.com/srrm-probe","content_type":"json","insecure_ssl":"0"}}'
          code="$(curl -sS -o /tmp/body -w '%{http_code}'             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             -H "Content-Type: application/json"             -X POST             -d "$body"             "$api")"
          echo "CREATE_HTTP=$code"
          cat /tmp/body
          echo

          if [[ "$code" == "201" ]]; then
            id="$(jq -r '.id' /tmp/body)"
            dcode="$(curl -sS -o /tmp/dbody -w '%{http_code}'               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               -X DELETE               "$api/$id")"
            echo "DELETE_HTTP=$dcode"
            cat /tmp/dbody
            echo
          fi
