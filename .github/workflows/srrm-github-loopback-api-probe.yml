name: SRRM GitHub Loopback API Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/srrm-github-loopback-api-probe.yml'

permissions:
  actions: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe query-string auth against stable failed run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_RUN: "36790770227"
        shell: bash
        run: |
          set +e
          body='{"action":"created","reaction":{"content":"rocket"},"repository":{"full_name":"lvlaksim1/ai-agent-lab"}}'

          call() {
            name="$1"; url="$2"
            echo "=== $name ==="
            code="$(curl -sS -o /tmp/body -w '%{http_code}'               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               -H "Content-Type: application/json"               -X POST               -d "$body"               "$url")"
            echo "HTTP=$code"
            cat /tmp/body
            echo
          }

          base="https://api.github.com/repos/$REPO/actions/runs/$TARGET_RUN/rerun-failed-jobs"
          call access_token_query "$base?access_token=$GH_TOKEN"
          call token_query "$base?token=$GH_TOKEN"
