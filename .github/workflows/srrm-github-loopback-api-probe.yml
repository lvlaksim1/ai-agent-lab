name: SRRM GitHub Loopback API Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/srrm-github-loopback-api-probe.yml'

permissions:
  actions: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe two immediate webhook-equivalent reruns
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_RUN: "36821505084"
        shell: bash
        run: |
          set -euo pipefail
          url="https://api.github.com/repos/$REPO/actions/runs/$TARGET_RUN/rerun-failed-jobs"
          body='{"action":"created","reaction":{"content":"eyes"},"repository":{"full_name":"lvlaksim1/ai-agent-lab"}}'
          for n in 1 2; do
            code="$(curl -sS -o "/tmp/body$n" -w '%{http_code}'               -u "x-access-token:$GH_TOKEN"               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               -H "Content-Type: application/json"               -X POST -d "$body" "$url")"
            echo "POST_$n=$code"
            cat "/tmp/body$n" || true
            echo
          done
