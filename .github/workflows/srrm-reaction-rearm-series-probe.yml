name: SRRM Reaction Rearm Series Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/srrm-reaction-rearm-series-probe.yml'

permissions:
  issues: read
  pull-requests: read
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Observe three sender-side same-opcode generations
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: "1"
          OWNER_LOGIN: "lvlaksim1"
          TARGET: "eyes"
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error
          repo=os.environ["REPO"]; pr=os.environ["PR_NUMBER"]; owner=os.environ["OWNER_LOGIN"]; target=os.environ["TARGET"]; token=os.environ["GH_TOKEN"]
          url=f"https://api.github.com/repos/{repo}/issues/{pr}/reactions?per_page=100"

          def get(etag=None):
              headers={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
              if etag: headers["If-None-Match"]=etag
              req=urllib.request.Request(url,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      used=r.headers.get("X-RateLimit-Used","")
                      return r.status, r.headers.get("ETag"), json.loads(r.read() or b"[]"), used
              except urllib.error.HTTPError as e:
                  if e.code==304:
                      return 304, e.headers.get("ETag") or etag, None, e.headers.get("X-RateLimit-Used","")
                  raise

          def key(items):
              if not items: return None
              rows=[x for x in items if x.get("user",{}).get("login")==owner and x.get("content")==target]
              if not rows: return None
              x=rows[-1]
              return (str(x.get("id")),str(x.get("created_at")))

          code,etag,items,used=get()
          last=key(items)
          print(f"BASE key={last} used={used}",flush=True)
          if last is None:
              print("RESULT=FAIL_NO_BASELINE",flush=True); raise SystemExit(2)

          generations=[]
          clears=0
          for poll in range(1,31):
              time.sleep(5)
              code,new_etag,items,used=get(etag)
              etag=new_etag or etag
              if code==304:
                  print(f"POLL poll={poll} code=304 used={used} generations={len(generations)}",flush=True)
                  continue
              cur=key(items)
              print(f"POLL poll={poll} code=200 key={cur} used={used} generations={len(generations)}",flush=True)
              if cur is None:
                  clears += 1
                  continue
              if cur != last:
                  generations.append(cur)
                  last=cur
                  print(f"GENERATION seq={len(generations)} key={cur} poll={poll}",flush=True)
                  if len(generations) >= 3:
                      print(f"SUMMARY generations=3 clears={clears} used={used}",flush=True)
                      print("RESULT=PASS_THREE_REARMS",flush=True)
                      raise SystemExit(0)

          print(f"SUMMARY generations={len(generations)} clears={clears}",flush=True)
          print("RESULT=TIMEOUT",flush=True)
          raise SystemExit(3)
          PY
