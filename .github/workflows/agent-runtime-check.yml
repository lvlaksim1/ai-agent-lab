name: Agent Runtime Check

on:
  push:
    paths:
      - ".agent/**"
      - ".github/scripts/enqueue-agent-event.cjs"
      - ".github/scripts/stale-worker-recovery.cjs"
      - ".github/workflows/agent-stale-recovery.yml"
      - ".github/workflows/agent-intake.yml"
      - "tools/validate-agent-runtime.mjs"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check stale-worker recovery script syntax
        run: node --check .github/scripts/stale-worker-recovery.cjs
      - name: Validate agent runtime invariants
        run: node tools/validate-agent-runtime.mjs
