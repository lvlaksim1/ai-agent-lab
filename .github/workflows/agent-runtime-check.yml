name: Agent Runtime Check

on:
  push:
    paths:
      - ".agent/config.json"
      - ".agent/state.json"
      - ".agent/wake.json"
      - ".agent/assignment.json"
      - ".agent/brigade.json"
      - ".agent/objects/**"
      - ".agent/management/**"
      - ".agent/queue/pending/**"
      - ".agent/queue/done/**"
      - ".agent/reports/starts/**"
      - ".agent/reports/otk/**"
      - ".agent/reports/latest*.md"
      - ".agent/schemas/**"
      - ".github/workflows/agent-runtime-check.yml"
      - "tools/validate-agent-runtime.mjs"
      - "tools/agent-report-contract.mjs"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate agent runtime invariants
        run: node tools/validate-agent-runtime.mjs
