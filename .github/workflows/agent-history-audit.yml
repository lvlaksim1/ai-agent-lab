name: Agent History Audit

on:
  push:
    paths:
      - ".agent/reporting.md"
      - ".agent/schemas/**"
      - "tools/agent-report-contract.mjs"
      - "tools/audit-agent-report-history.mjs"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit immutable report history without retroactive failure
        run: node tools/audit-agent-report-history.mjs
