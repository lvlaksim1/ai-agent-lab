name: Agent Telegram Report

on:
  push:
    branches:
      - work-webhook-test
    paths:
      - '.agent/reports/published/*.md'

concurrency:
  group: agent-telegram-report
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout report
        uses: actions/checkout@v4
        with:
          ref: work-webhook-test
          fetch-depth: 2

      - name: Build Telegram message
        id: report
        shell: bash
        run: |
          set -euo pipefail
          REPORT_FILE="$(git diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD -- '.agent/reports/published/*.md' | head -n 1)"
          if [ -z "$REPORT_FILE" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "No newly created immutable report in this commit."
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          python - "$REPORT_FILE" <<'PY'
          from pathlib import Path
          import sys
          report = Path(sys.argv[1]).read_text(encoding="utf-8").strip()
          if not report:
              raise SystemExit("Empty brigade report")
          if len(report) > 3900:
              report = report[:3898].rstrip() + "…"
          Path("telegram-message.txt").write_text(report, encoding="utf-8")
          PY
      - name: Send report to Telegram
        if: steps.report.outputs.publish == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TELEGRAM_BOT_TOKEN:-}" || { echo "::error::TELEGRAM_BOT_TOKEN is not configured"; exit 1; }
          test -n "${TELEGRAM_CHAT_ID:-}" || { echo "::error::TELEGRAM_CHAT_ID is not configured"; exit 1; }

          API="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
          SUCCESS=false
          for ATTEMPT in 1 2 3; do
            RESPONSE="$RUNNER_TEMP/telegram-response.json"
            HTTP=$(curl --silent --show-error --output "$RESPONSE" --write-out "%{http_code}"               -X POST "$API"               --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}"               --data-urlencode "text@telegram-message.txt" || true)
            if [ "$HTTP" = "200" ] && jq -e '.ok == true' "$RESPONSE" >/dev/null 2>&1; then
              SUCCESS=true
              break
            fi
            [ "$ATTEMPT" -lt 3 ] && sleep $((ATTEMPT * 5))
          done
          [ "$SUCCESS" = "true" ] || { echo "::error::Telegram delivery failed"; exit 1; }
