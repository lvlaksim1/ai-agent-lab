name: SRRM Reaction Poller Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/srrm-reaction-poller-probe.yml'

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Receive and self-reset PR reactions
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: "1"
          OWNER_LOGIN: "lvlaksim1"
          TARGET_COUNT: "16"
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for poll in $(seq 1 300); do
            json="$(gh api -H "Accept: application/vnd.github+json" "repos/$REPO/issues/$PR_NUMBER/reactions")"
            mapfile -t rows < <(jq -r --arg u "$OWNER_LOGIN" '.[] | select(.user.login==$u) | [.id,.content] | @tsv' <<<"$json")
            if (( ${#rows[@]} > 0 )); then
              for row in "${rows[@]}"; do
                rid="${row%%$'\t'*}"
                reaction="${row#*$'\t'}"
                count=$((count + 1))
                echo "SIGNAL_DETECTED seq=$count reaction=$reaction id=$rid poll=$poll utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                gh api --method DELETE -H "Accept: application/vnd.github+json" "repos/$REPO/issues/$PR_NUMBER/reactions/$rid"
                echo "SIGNAL_RESET seq=$count reaction=$reaction id=$rid utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              done
              if (( count >= TARGET_COUNT )); then
                echo "TARGET_REACHED count=$count"
                exit 0
              fi
            fi
            sleep 3
          done
          echo "TIMEOUT count=$count"
          exit 1
