name: SRRM Reaction Poll Cost Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/srrm-reaction-poll-cost-probe.yml'

permissions:
  issues: read
  pull-requests: read
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Idle ETag polling at 5s
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: "1"
        shell: bash
        run: |
          set -euo pipefail
          url="https://api.github.com/repos/$REPO/issues/$PR_NUMBER/reactions?per_page=100"
          etag=""
          polls=0
          n200=0
          n304=0
          first_used=""
          last_used=""
          first_remaining=""
          last_remaining=""

          for i in $(seq 1 12); do
            polls=$((polls+1))
            rm -f /tmp/h /tmp/b
            args=(
              -sS -D /tmp/h -o /tmp/b -w '%{http_code}'
              -H "Authorization: Bearer $GH_TOKEN"
              -H "Accept: application/vnd.github+json"
              -H "X-GitHub-Api-Version: 2022-11-28"
            )
            if [[ -n "$etag" ]]; then
              args+=( -H "If-None-Match: $etag" )
            fi

            code="$(curl "${args[@]}" "$url")"
            new_etag="$(awk 'BEGIN{IGNORECASE=1} /^etag:/ {sub(/^[^:]*:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' /tmp/h)"
            used="$(awk 'BEGIN{IGNORECASE=1} /^x-ratelimit-used:/ {sub(/^[^:]*:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' /tmp/h)"
            remaining="$(awk 'BEGIN{IGNORECASE=1} /^x-ratelimit-remaining:/ {sub(/^[^:]*:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' /tmp/h)"
            [[ -n "$new_etag" ]] && etag="$new_etag"

            [[ -z "$first_used" && -n "$used" ]] && first_used="$used"
            [[ -z "$first_remaining" && -n "$remaining" ]] && first_remaining="$remaining"
            [[ -n "$used" ]] && last_used="$used"
            [[ -n "$remaining" ]] && last_remaining="$remaining"

            if [[ "$code" == "200" ]]; then
              n200=$((n200+1))
            elif [[ "$code" == "304" ]]; then
              n304=$((n304+1))
            else
              echo "UNEXPECTED_HTTP poll=$polls code=$code"
            fi

            echo "POLL poll=$polls code=$code used=$used remaining=$remaining"
            if (( i < 12 )); then sleep 5; fi
          done

          echo "SUMMARY polls=$polls http200=$n200 http304=$n304 first_used=$first_used last_used=$last_used first_remaining=$first_remaining last_remaining=$last_remaining"
