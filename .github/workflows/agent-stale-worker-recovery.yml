name: Agent Stale Worker Recovery

on:
  push:
    branches:
      - work-webhook-test
    paths:
      - ".agent/state.json"
      - ".github/scripts/stale-worker-recovery.cjs"
      - ".github/scripts/stale-worker-watchdog.cjs"
      - ".github/workflows/agent-stale-worker-recovery.yml"

permissions:
  contents: write

concurrency:
  group: agent-stale-worker-watchdog
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work-webhook-test
          fetch-depth: 0
      - name: Guard stale workers before the next production clock
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUNTIME_REF: work-webhook-test
        run: node .github/scripts/stale-worker-watchdog.cjs
