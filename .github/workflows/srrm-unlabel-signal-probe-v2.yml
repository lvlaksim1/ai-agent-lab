name: SRRM Unlabel Signal Probe V2

on:
  pull_request_target:
    types: [unlabeled]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  signal:
    if: github.event.pull_request.number == 1 && github.event.label.name == 'question'
    runs-on: ubuntu-latest
    steps:
      - name: Record signal
        run: |
          echo "SRRM_UNLABEL_SIGNAL=question"
          echo "UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - name: Rearm label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: "1"
          LABEL: "question"
        run: gh pr edit "$NUMBER" --repo "$REPO" --add-label "$LABEL"
