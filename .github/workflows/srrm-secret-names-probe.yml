name: SRRM Secret Names Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/srrm-secret-names-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: List available secret names only
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        shell: bash
        run: |
          set -euo pipefail
          jq -r 'keys[]' <<<"$SECRETS_JSON" | sed 's/^/SECRET_NAME=/'
