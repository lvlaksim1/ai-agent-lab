name: SRRM Failed Run Doorbell Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/srrm-failed-run-doorbell-probe.yml'

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  doorbell:
    runs-on: ubuntu-latest
    steps:
      - name: Read opcode, dispatch work, and reset reaction
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: "1"
          OWNER_LOGIN: "lvlaksim1"
        shell: bash
        run: |
          set -euo pipefail
          json="$(gh api -H "Accept: application/vnd.github+json" "repos/$REPO/issues/$PR_NUMBER/reactions")"
          mapfile -t rows < <(jq -r --arg u "$OWNER_LOGIN" '.[] | select(.user.login==$u) | [.id,.content,.created_at] | @tsv' <<<"$json")

          if (( ${#rows[@]} == 0 )); then
            echo "SRRM_OPCODE=NONE"
          else
            last="${rows[-1]}"
            rest="${last#*$'\t'}"
            reaction="${rest%%$'\t'*}"
            echo "SRRM_OPCODE=$reaction"

            payload="$(jq -nc --arg op "$reaction" '{event_type:"srrm_reaction",client_payload:{opcode:$op,source:"pr-reaction-doorbell"}}')"
            gh api --method POST "repos/$REPO/dispatches" --input - <<<"$payload"
            echo "SRRM_DISPATCHED=$reaction"

            for row in "${rows[@]}"; do
              id="${row%%$'\t'*}"
              gh api --method DELETE -H "Accept: application/vnd.github+json" "repos/$REPO/issues/$PR_NUMBER/reactions/$id"
            done
            echo "REACTIONS_RESET=${#rows[@]}"
          fi

      - name: Keep doorbell rerunnable
        run: |
          echo "INTENTIONAL_FAILURE=1"
          exit 1
