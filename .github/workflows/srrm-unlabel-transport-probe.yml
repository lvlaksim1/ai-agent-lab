name: SRRM Unlabel Transport Probe

on:
  pull_request_target:
    types: [unlabeled]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  signal-and-rearm:
    if: github.event.pull_request.number == 1 && github.event.label.name == 'question'
    runs-on: ubuntu-latest
    steps:
      - name: Record command
        run: echo "SRRM_COMMAND=question"
      - name: Rearm label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr edit "$NUMBER" --repo "$REPO" --add-label question
