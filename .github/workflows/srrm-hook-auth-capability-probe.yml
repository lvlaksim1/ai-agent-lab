name: SRRM Hook Auth Capability Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/srrm-hook-auth-capability-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check AGENT_TOKEN and hook permission without exposing secret
        env:
          AGENT_TOKEN: ${{ secrets.AGENT_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$AGENT_TOKEN" ]]; then
            echo "AGENT_TOKEN_PRESENT=0"
            exit 0
          fi
          echo "AGENT_TOKEN_PRESENT=1"

          hook_url="https://x-access-token:$AGENT_TOKEN@api.github.com/repos/$REPO/actions/runs/36790770227/rerun-failed-jobs"
          payload="$(jq -nc --arg url "$hook_url" '{
            name:"web",
            active:false,
            events:["reaction"],
            config:{url:$url,content_type:"json",insecure_ssl:"0"}
          }')"

          code="$(curl -sS -o /tmp/hook -w '%{http_code}' \
            -H "Authorization: Bearer $AGENT_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -X POST \
            --data-binary "$payload" \
            "https://api.github.com/repos/$REPO/hooks")"

          echo "HOOK_CREATE_HTTP=$code"

          if [[ "$code" == "201" ]]; then
            id="$(jq -r '.id' /tmp/hook)"
            echo "HOOK_CREATE_OK=1"
            echo "HOOK_ID=$id"
            dcode="$(curl -sS -o /tmp/del -w '%{http_code}' \
              -H "Authorization: Bearer $AGENT_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -X DELETE \
              "https://api.github.com/repos/$REPO/hooks/$id")"
            echo "HOOK_DELETE_HTTP=$dcode"
          else
            echo "HOOK_CREATE_OK=0"
            jq -r '.message // empty' /tmp/hook | sed 's/.*/HOOK_ERROR_PRESENT=1/'
          fi
